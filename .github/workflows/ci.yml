name: Protagonist CI

on:
  push:
  pull_request:

jobs:
  core:
    name: Protagonist core modules (JVM)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Format check + unit, contract and acceptance tests (platform-neutral modules)
        run: ./gradlew -Pprotagonist.android=false spotlessCheck test --stacktrace

  android:
    name: Protagonist Android (build + Robolectric UI tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - uses: android-actions/setup-android@v3
      - name: Lint, tests, debug APK
        run: ./gradlew spotlessCheck test lintDebug assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: protagonist-reports
          path: |
            **/build/reports/
            app/build/outputs/apk/debug/*.apk

  instrumented:
    name: Protagonist instrumented Compose tests (tablet emulator)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_tablet
          script: ./gradlew connectedDebugAndroidTest
