name: Protagonist CI

on:
  push:
  pull_request:

jobs:
  core:
    name: Protagonist core modules (JVM)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v5
      - name: Format check + unit, contract and acceptance tests (platform-neutral modules)
        run: ./gradlew -Pprotagonist.android=false spotlessCheck test --stacktrace

  android:
    name: Protagonist Android (build + Robolectric UI tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v5
      # GitHub's ubuntu runners ship the Android SDK (ANDROID_HOME); AGP installs missing platforms itself.
      - name: Lint, tests, debug APK
        run: ./gradlew spotlessCheck test lintDebug assembleDebug --stacktrace
      - name: Installable debug APK (simulator backend)
        uses: actions/upload-artifact@v5
        with:
          name: protagonist-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: protagonist-reports
          path: "**/build/reports/"

  instrumented:
    name: Protagonist instrumented Compose tests + screen recording (${{ matrix.device.name }} emulator)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        device:
          - { name: tablet, profile: pixel_tablet }
          - { name: phone, profile: pixel_7 }
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v5
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: ${{ matrix.device.profile }}
          disable-animations: false
          script: scripts/ci_instrumented.sh ${{ matrix.device.name }}
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: protagonist-screen-recording-${{ matrix.device.name }}
          path: build/device-recording/
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: protagonist-instrumented-reports-${{ matrix.device.name }}
          path: app/build/reports/androidTests/
